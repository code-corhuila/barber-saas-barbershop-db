databaseChangeLog:
  - changeSet:
      id: ddl-alter-001
      author: carlosleal16
      labels: "HU-APPT-001,ddl,alter"
      comment: "Foreign keys inside the domain, each declaring its delete behaviour. None to another domain (Annex J J.3.4)."
      changes:
        - sqlFile:
            path: 001_add_foreign_keys.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/001_add_foreign_keys.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-alter-002
      author: carlosleal16
      labels: "HU-SHOP-002,ddl,alter"
      comment: "The barber's name and photo as a snapshot from identity-auth (ADR-014, closes OQ-08). Older rows stay NULL."
      changes:
        - sqlFile:
            path: 002_add_barber_display_snapshot.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/002_add_barber_display_snapshot.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
